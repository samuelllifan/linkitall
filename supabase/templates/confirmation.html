<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <title>Confirm your email</title>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #09090b; color: #ededed; -webkit-font-smoothing: antialiased; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;"
  >
    <!-- Preheader: shown as the inbox preview, hidden in the body. -->
    <div
      style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #09090b;"
    >
      Confirm your email to start building your stacked page.
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #09090b;"
    >
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <!-- Card -->
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="width: 480px; max-width: 100%; background-color: #111113; border: 1px solid #26262b; border-radius: 16px;"
          >
            <tr>
              <td style="padding: 40px 40px 32px 40px;">
                <!-- Brand -->
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="vertical-align: middle; padding-right: 8px;">
                      <!-- Layered-stack mark; clients that strip SVG fall back
                           to the wordmark beside it. -->
                      <svg
                        width="22"
                        height="22"
                        viewBox="0 0 100 100"
                        fill="none"
                        stroke="#ffffff"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <polygon
                          points="50,8 88,30 50,52 12,30"
                          stroke-width="7"
                          stroke-linejoin="round"
                        />
                        <polyline
                          points="12,48 50,70 88,48"
                          stroke-width="7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          opacity="0.58"
                        />
                        <polyline
                          points="12,64 50,86 88,64"
                          stroke-width="7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          opacity="0.3"
                        />
                      </svg>
                    </td>
                    <td style="vertical-align: middle;">
                      <span
                        style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff;"
                        >stacked</span
                      >
                    </td>
                  </tr>
                </table>

                <!-- Headline -->
                <h1
                  style="margin: 28px 0 0 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; color: #ffffff;"
                >
                  Confirm your email
                </h1>

                <!-- Body / CTA: "here" is the confirmation link. -->
                <p
                  style="margin: 16px 0 0 0; font-size: 16px; line-height: 1.6; color: #ededed;"
                >
                  <a
                    href="{{ .ConfirmationURL }}"
                    target="_blank"
                    style="color: #8b8bf5; font-weight: 600; text-decoration: underline;"
                    >Click here</a
                  >
                  to finish signing up for stacked and start creating your page.
                </p>

                <!-- Divider -->
                <div
                  style="margin: 32px 0 0 0; border-top: 1px solid #26262b;"
                ></div>

                <!-- Footer -->
                <p
                  style="margin: 20px 0 0 0; font-size: 13px; line-height: 1.6; color: #71717a;"
                >
                  If you didn't create a stacked account, you can safely ignore
                  this email — nothing will happen.
                </p>
              </td>
            </tr>
          </table>

          <!-- Sub-footer -->
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="width: 480px; max-width: 100%;"
          >
            <tr>
              <td style="padding: 20px 40px 0 40px;" align="center">
                <span style="font-size: 12px; color: #52525b;">stacked.page</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
